name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read the repository, nothing more.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned by commit, their release in the comment.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Typecheck, lint, format, the content check and every test (SPEC §4.3).
      - run: npm run check
      # Core and the server never read the machine's time zone (SPEC §4.2): their tests pass far from UTC too.
      - name: Core's and the server's tests in another time zone
        run: npm test -w packages/core && npm test -w backend
        env:
          TZ: Pacific/Auckland
      - run: npm run build
      # The daily stack's image (Dockerfile): a change that breaks it fails here, not on the PC.
      - run: docker build -t teatime:ci .
