# TeaTime's daily stack (SPEC §3.7; docs/runbook.md): one container on this PC, published on
# 127.0.0.1:8081 only, which `tailscale serve --bg --https=8443 http://127.0.0.1:8081` puts on the
# tailnet. Its own project: it never touches EagleEye's (`eagleeye`), its ports (8080, 3100, 5433) or
# its Tailscale 443.
name: teatime

services:
  app:
    build: .
    image: teatime:daily
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:3200"
    environment:
      APP_ENV: daily
      # The app's address: push links and the same-origin check (SPEC §3.4).
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://desktop-obf71rf.taild9afa4.ts.net:8443}
      BACKUP_DIR: /backups
      # Web push: the repo-root .env that `npm run daily:vapid` writes. Without them, pushes are off.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:teatime@example.com}
    volumes:
      # The database lives only in its named volume, never on the Windows drive (SPEC §3.7).
      - data:/data
      # The daily backups, on the PC, outside Docker and the repo.
      - ${BACKUP_DIR:-D:/TeaTime-backups}:/backups
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3200/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  data:
