code: "011"
slug: lady-grey
name: Lady Grey
mode: safe
family: earl-grey
trust: documented
source_type: tea-house
origin: England
story: >
  Lady Grey is Twinings' own blend and trademark: an Earl Grey with orange and lemon peel and only a
  hint of bergamot. Twinings says it created it in the early 1990s for the Nordic market, which found
  Earl Grey too strong; it went on sale in Norway in 1994 and in Britain in 1996. It is named after
  Mary Elizabeth Grey, wife of the 2nd Earl Grey. No tea house gives a home share of peel, so the
  peels here are an estimate, more than the blend's few percent: its citrus flavouring isn't in them.
difficulty: 1
flavours: [citrus, bergamot]
caffeine: medium
scaling: per-cup
serves: 2
