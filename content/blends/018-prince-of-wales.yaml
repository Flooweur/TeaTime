code: "018"
slug: prince-of-wales
name: Twinings' Prince of Wales
mode: safe
family: court
trust: attested
source_type: tea-house
origin: England (London)
story: >
  Twinings says it first blended this tea in 1921 for the Prince of Wales, the future Edward VIII, who
  let it carry his title; other accounts call it his own blend, which he let Twinings sell. Twinings
  withdrew it from sale in Britain when he became king in 1936, and still sells it abroad. Old British
  tins named Keemun; today's packs say only China teas. So this is Keemun alone, lighter than #016:
  less leaf, boiling water and a short steep, for the soft, delicate cup Twinings describes.
difficulty: 1
flavours: [light, nutty]
caffeine: medium
scaling: per-cup
serves: 2
