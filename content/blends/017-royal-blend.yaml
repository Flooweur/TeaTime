code: "017"
slug: royal-blend
name: Fortnum & Mason's Royal Blend
mode: safe
family: court
trust: attested
source_type: tea-house
origin: England (London)
story: >
  Fortnum & Mason says that in 1902 King Edward VII asked for the finest tea in the land, and that it
  searched abroad and made him Royal Blend: Assam from India, lifted by a Flowery Pekoe from Sri Lanka,
  for a smooth, honeyed cup. It is still the house's benchmark tea. Other accounts only retell its
  story, and no document was found. The house names the teas but not their shares: the 3 to 2 of
  Assam to Ceylon here is our own, the Assam as the body and the Ceylon the smaller part.
difficulty: 1
flavours: [malty, honeyed]
caffeine: medium
scaling: per-cup
serves: 2
sources:
